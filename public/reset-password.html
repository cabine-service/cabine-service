<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Réinitialiser le mot de passe — Cabine Service</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <a href="/" style="display:flex; flex-direction:column; align-items:center; text-decoration:none; margin-bottom:16px;">
                <img src="logo.png" alt="Cabine Service" style="height:50px; width:auto;" />
                <span style="font-size:1.4rem; font-weight:600; color:var(--bordeaux-fonce); margin-top:4px;">Cabine Service</span>
            </a>
            <h1>Nouveau mot de passe</h1>
            <p>Choisissez un nouveau mot de passe.</p>

            <form id="resetPasswordForm">
                <label for="newPassword">Nouveau mot de passe</label>
                <input type="password" id="newPassword" placeholder="Min. 6 caractères" minlength="6" required />

                <label for="confirmPassword">Confirmer le mot de passe</label>
                <input type="password" id="confirmPassword" placeholder="Confirmer" required />

                <button type="submit" class="btn">Réinitialiser</button>
            </form>

            <div id="resetStatus"></div>

            <div class="footer-links">
                <a href="login.html">Retour à la connexion</a>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('resetStatus').innerHTML = '❌ Lien invalide ou expiré.';
            document.getElementById('resetStatus').style.color = '#b33c3c';
            document.querySelector('form').style.display = 'none';
        }

        document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const status = document.getElementById('resetStatus');

            if (newPassword !== confirmPassword) {
                status.innerHTML = '❌ Les mots de passe ne correspondent pas';
                status.style.color = '#b33c3c';
                return;
            }

            if (newPassword.length < 6) {
                status.innerHTML = '❌ Le mot de passe doit faire au moins 6 caractères';
                status.style.color = '#b33c3c';
                return;
            }

            status.innerHTML = '⏳ Mise à jour en cours...';
            status.style.color = 'var(--marron-fonce)';

            try {
                const response = await fetch('https://cabine-service.onrender.com/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    status.innerHTML = '✅ Mot de passe mis à jour ! Redirection...';
                    status.style.color = '#1a7a3a';
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    status.innerHTML = '❌ ' + (data.error || 'Erreur');
                    status.style.color = '#b33c3c';
                }
            } catch (error) {
                status.innerHTML = '❌ Erreur de connexion au serveur.';
                status.style.color = '#b33c3c';
            }
        });
    </script>

</body>
</html>
