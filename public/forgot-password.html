<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mot de passe oublié — Cabine Service</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <a href="/" style="display:flex; flex-direction:column; align-items:center; text-decoration:none; margin-bottom:16px;">
                <img src="logo.png" alt="Cabine Service" style="height:50px; width:auto;" />
                <span style="font-size:1.4rem; font-weight:600; color:var(--bordeaux-fonce); margin-top:4px;">Cabine Service</span>
            </a>
            <h1>Mot de passe oublié</h1>
            <p>Entrez votre email pour recevoir un lien de réinitialisation.</p>

            <form id="forgotPasswordForm">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="contact@boutique.com" required />
                <button type="submit" class="btn">Envoyer le lien</button>
            </form>

            <div id="forgotStatus"></div>

            <div class="footer-links">
                <a href="login.html">Retour à la connexion</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const status = document.getElementById('forgotStatus');

            status.innerHTML = '⏳ Envoi en cours...';
            status.style.color = 'var(--marron-fonce)';

            try {
                const response = await fetch('https://cabine-service.onrender.com/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    status.innerHTML = '✅ Un lien de réinitialisation vous a été envoyé par email.';
                    status.style.color = '#1a7a3a';
                    document.getElementById('email').value = '';
                } else {
                    status.innerHTML = '❌ ' + (data.error || 'Email introuvable');
                    status.style.color = '#b33c3c';
                }
            } catch (error) {
                status.innerHTML = '❌ Erreur de connexion au serveur.';
                status.style.color = '#b33c3c';
            }
        });
    </script>

</body>
</html>
