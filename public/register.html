<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription — Cabine Service</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#0b1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script>
      if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('✅ Service Worker enregistré'))
              .catch(err => console.error('❌ Erreur SW:', err));
      }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #0b1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-card {
      background: #ffffff;
      padding: 40px 32px;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      border: 1px solid #eaeef2;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .auth-card h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: #0b1a2e;
      margin-bottom: 4px;
    }
    .auth-card p {
      color: #4a5a6a;
      margin-bottom: 24px;
    }
    .auth-card label {
      display: block;
      font-weight: 500;
      margin-bottom: 6px;
      color: #0b1a2e;
    }
    .auth-card input,
    .auth-card select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d0d9e6;
      border-radius: 12px;
      font-size: 1rem;
      margin-bottom: 16px;
      background: #fafcff;
      transition: 0.2s;
    }
    .auth-card input:focus,
    .auth-card select:focus {
      border-color: #0b1a2e;
      outline: none;
      box-shadow: 0 0 0 3px rgba(11, 26, 46, 0.06);
    }
    .auth-card .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #0b1a2e;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.25s ease;
      text-align: center;
      text-decoration: none;
    }
    .auth-card .btn:hover {
      background: #1a2f4a;
    }
    #registerStatus {
      margin-top: 12px;
      font-weight: 500;
      text-align: center;
    }
    .footer-links {
      text-align: center;
      margin-top: 20px;
      font-size: 0.95rem;
      color: #4a5a6a;
    }
    .footer-links a {
      color: #0b1a2e;
      text-decoration: none;
      font-weight: 500;
    }
    .footer-links a:hover {
      text-decoration: underline;
    }
    small {
      color: #6b7a8a;
      font-size: 0.8rem;
      display: block;
      margin-top: -8px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <h1>Créer un compte</h1>
    <p>Inscrivez votre magasin et simplifiez les essayages.</p>
    <form id="registerForm">
      <label for="shopName">Nom du magasin</label>
      <input type="text" id="shopName" placeholder="Ma Boutique" required />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="contact@boutique.com" required />

      <label for="phone">Téléphone</label>
      <input type="tel" id="phone" placeholder="+243 999 999 999" required />

      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="Min. 6 caractères" minlength="6" required />

      <label for="confirmPassword">Confirmer le mot de passe</label>
      <input type="password" id="confirmPassword" placeholder="Retapez le mot de passe" required />

      <label for="cabines">Nombre de cabines</label>
      <select id="cabines">
        <option value="1">1 cabine — 10 $ / mois (~ 28 000 FC)</option>
        <option value="2">2 cabines — 20 $ / mois (~ 56 000 FC)</option>
        <option value="3" selected>3 cabines — 30 $ / mois (~ 84 000 FC)</option>
        <option value="4">4 cabines — 40 $ / mois (~ 112 000 FC)</option>
        <option value="5">5 cabines — 50 $ / mois (~ 140 000 FC)</option>
        <option value="10">10 cabines — 100 $ / mois (~ 280 000 FC)</option>
      </select>

      <label for="telegramToken">Token Telegram (bot)</label>
      <input type="text" id="telegramToken" placeholder="Collez le token de votre bot" required />
      <small>Créez un bot avec @BotFather sur Telegram</small>

      <label for="telegramChatId">Votre ID Telegram</label>
      <input type="text" id="telegramChatId" placeholder="Obtenez-le avec @userinfobot" required />
      <small>Envoyez /start à @userinfobot pour récupérer votre ID</small>

      <button type="submit" class="btn">S'abonner maintenant</button>
      <button id="installAppBtn" class="btn" style="display:none; margin-top: 16px; background: #28a745; color: white;">
    📲 Installer l'application </button>

    </form>
    <div id="registerStatus"></div>
    <div class="footer-links">
      Déjà un compte ? <a href="login.html">Se connecter</a>
    </div>
  </div>
  <script>
    const registerForm = document.getElementById('registerForm');
    const registerStatus = document.getElementById('registerStatus');
    registerForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      const shopName = document.getElementById('shopName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      const cabines = document.getElementById('cabines').value;
      const telegramToken = document.getElementById('telegramToken').value.trim();
      const telegramChatId = document.getElementById('telegramChatId').value.trim();

      if (password !== confirm) {
        registerStatus.innerHTML = '❌ Les mots de passe ne correspondent pas';
        registerStatus.style.color = '#b33c3c';
        return;
      }
      if (!telegramToken || !telegramChatId) {
        registerStatus.innerHTML = '❌ Veuillez configurer votre bot Telegram';
        registerStatus.style.color = '#b33c3c';
        return;
      }
      registerStatus.innerHTML = '⏳ Création du compte en cours...';
      registerStatus.style.color = '#0b1a2e';

      try {
        const response = await fetch('https://cabine-service.onrender.com/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ shopName, email, phone, password, cabines, telegramToken, telegramChatId })
        });
        const data = await response.json();
        if (response.ok && data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('shop', JSON.stringify(data.shop));
          registerStatus.innerHTML = '✅ Compte créé ! Redirection...';
          registerStatus.style.color = '#1a7a3a';
          setTimeout(() => window.location.href = 'dashboard.html', 1500);
        } else {
          registerStatus.innerHTML = '❌ ' + (data.error || 'Erreur lors de l\'inscription');
          registerStatus.style.color = '#b33c3c';
        }
      } catch (error) {
        registerStatus.innerHTML = '❌ Erreur de connexion au serveur.';
        registerStatus.style.color = '#b33c3c';
      }
    });
  </script>
  <script>
    // ==================== INSTALLATION PWA ====================
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
        // Empêcher la bannière par défaut
        e.preventDefault();
        deferredPrompt = e;

        // Afficher le bouton d'installation personnalisé
        const installBtn = document.getElementById('installAppBtn');
        installBtn.style.display = 'block';

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                // Afficher la fenêtre d'installation
                deferredPrompt.prompt();
                const result = await deferredPrompt.userChoice;
                console.log('✅ Résultat installation:', result.outcome);
                deferredPrompt = null;

                // Cacher le bouton après installation
                if (result.outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
            }
        });
    });

    // Si l'app est déjà installée, cacher le bouton
    window.addEventListener('appinstalled', () => {
        console.log('✅ App installée avec succès');
        document.getElementById('installAppBtn').style.display = 'none';
    });
</script>

</body>
</html>
