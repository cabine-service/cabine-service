<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — Cabine Service</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        /* ===== PAGE SPÉCIFIQUE CONNEXION ===== */
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f6f8fc;
            padding: 24px;
        }
        .auth-card {
            background: #ffffff;
            padding: 40px 32px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(11, 26, 46, 0.08);
            max-width: 420px;
            width: 100%;
            border: 1px solid #eaeef2;
        }
        .auth-card h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0b1a2e;
            margin-bottom: 8px;
        }
        .auth-card p {
            color: #4a5a6a;
            margin-bottom: 24px;
        }
        .auth-card label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: #0b1a2e;
        }
        .auth-card input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d0d9e6;
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 16px;
            background: #fafcff;
            transition: 0.2s;
        }
        .auth-card input:focus {
            border-color: #0b1a2e;
            outline: none;
            box-shadow: 0 0 0 3px rgba(11, 26, 46, 0.06);
        }
        .auth-card .btn {
            width: 100%;
            justify-content: center;
            text-align: center;
            padding: 12px;
            font-size: 1rem;
        }
        .auth-card .btn-primary {
            background: #0b1a2e;
            color: #fff;
        }
        .auth-card .btn-primary:hover {
            background: #1a2f4a;
        }
        .auth-card .footer-links {
            text-align: center;
            margin-top: 20px;
            font-size: 0.95rem;
            color: #4a5a6a;
        }
        .auth-card .footer-links a {
            color: #0b1a2e;
            text-decoration: none;
            font-weight: 500;
        }
        .auth-card .footer-links a:hover {
            text-decoration: underline;
        }
        #loginStatus {
            margin-top: 12px;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <h1>🔐 Connexion</h1>
            <p>Accédez à votre espace gérant</p>

            <form id="loginForm">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="ex: contact@boutique.com" required />

                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required />

                <button type="submit" class="btn btn-primary">Se connecter</button>
            </form>

            <div id="loginStatus"></div>

            <div class="footer-links">
                Pas encore de compte ? <a href="register.html">S'inscrire</a>
            </div>
        </div>
    </div>

    <script>
        // ===== LOGIN =====
        const loginForm = document.getElementById('loginForm');
        const loginStatus = document.getElementById('loginStatus');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            loginStatus.innerHTML = '⏳ Connexion en cours...';
            loginStatus.style.color = '#0b1a2e';

            try {
                const response = await fetch('https://cabine-service.onrender.com/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('shop', JSON.stringify(data.shop));

                    loginStatus.innerHTML = '✅ Connexion réussie, redirection...';
                    loginStatus.style.color = '#1a7a3a';

                    // Rediriger vers le dashboard ou admin
                    if (email === 'admin@cabineservice.com') {
                        setTimeout(() => window.location.href = 'admin.html', 1000);
                    } else {
                        setTimeout(() => window.location.href = 'dashboard.html', 1000);
                    }
                } else {
                    loginStatus.innerHTML = '❌ ' + (data.error || 'Email ou mot de passe incorrect');
                    loginStatus.style.color = '#b33c3c';
                }
            } catch (error) {
                loginStatus.innerHTML = '❌ Erreur de connexion au serveur.';
                loginStatus.style.color = '#b33c3c';
            }
        });
    </script>

</body>
</html>
