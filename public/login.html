<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Cabine Service</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container login-container">
        <div class="header">
            <h1>Connexion</h1>
            <p>Accédez à votre espace gérant</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="contact@boutique.com" required>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="Votre mot de passe" required>
            </div>

            <button type="submit" id="loginBtn" class="btn btn-login">Se connecter</button>
        </form>

        <div id="statusMessage"></div>

        <div class="footer">
            <p>Pas encore de compte ? <a href="register.html">S'inscrire</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
