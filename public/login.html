<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — Cabine Service</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <!-- ===== LOGO + TITRE ===== -->
            <a href="/" style="display:flex; flex-direction:column; align-items:center; text-decoration:none; margin-bottom:16px;">
                <img src="logo.png" alt="Cabine Service" style="height:50px; width:auto;" />
                <span style="font-size:1.4rem; font-weight:600; color:var(--bordeaux-fonce); margin-top:4px;">Cabine Service</span>
            </a>

            <h1>Connexion</h1>
            <p>Accédez à votre espace gérant</p>

            <form id="loginForm">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="ex: contact@boutique.com" required />

                <label for="password">Mot de passe</label>
                <div style="position:relative;">
                    <input type="password" id="password" placeholder="••••••••" required style="padding-right:48px;" />
                    <button type="button" id="togglePassword" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:transparent; border:none; cursor:pointer; font-size:1.2rem;">
                        👁️
                    </button>
                </div>

                <div style="text-align:right; margin-top:-8px; margin-bottom:16px;">
                    <a href="forgot-password.html" style="font-size:0.85rem; color:var(--bordeaux-vif); text-decoration:none;">
                        Mot de passe oublié ?
                    </a>
                </div>

                <button type="submit" class="btn">Se connecter</button>
            </form>

            <div id="loginStatus"></div>

            <div class="footer-links">
                Pas encore de compte ? <a href="register.html">S'inscrire</a>
            </div>
        </div>
        <button id="installAppBtn" style="display:block; background:#7A1C2E; color:#fff; border:none; padding:12px 24px; border-radius:30px; font-size:1rem; cursor:pointer; margin:20px auto; width:fit-content;">
    📲 Télécharger l'application
        </button>
    </div>
    <script>
    // ===== BOUTON PWA PERMANENT =====
        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');
    
        // Écouter l'événement d'installation
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });
    
        // Si l'événement n'est jamais déclenché, on affiche quand même le bouton
        setTimeout(() => {
            installBtn.style.display = 'block';
        }, 2000);
    
        // Clic sur le bouton
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                // Installation possible
                deferredPrompt.prompt();
                const result = await deferredPrompt.userChoice;
                if (result.outcome === 'accepted') {
                    console.log('✅ App installée avec succès');
                    installBtn.textContent = '✅ App installée';
                    installBtn.style.background = '#28a745';
                }
                deferredPrompt = null;
            } else {
                // Installation impossible → alternative
                alert('📱 Ajoutez cette page à l\'écran d\'accueil :\n\n' +
                      '• Android : Menu → "Ajouter à l\'écran d\'accueil"\n' +
                      '• iPhone : Partager → "Ajouter à l\'écran d\'accueil"');
            }
        });
    </script>

    <script>
        // ===== CONNEXION =====
        const loginForm = document.getElementById('loginForm');
        const loginStatus = document.getElementById('loginStatus');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            loginStatus.innerHTML = '⏳ Connexion en cours...';
            loginStatus.style.color = 'var(--marron-fonce)';

            try {
                const response = await fetch('https://cabine-service.onrender.com/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('shop', JSON.stringify(data.shop));

                    loginStatus.innerHTML = '✅ Connexion réussie, redirection...';
                    loginStatus.style.color = '#1a7a3a';

                    if (email === 'admin@cabineservice.com') {
                        setTimeout(() => window.location.href = 'admin.html', 1000);
                    } else {
                        setTimeout(() => window.location.href = 'dashboard.html', 1000);
                    }
                } else {
                    loginStatus.innerHTML = '❌ ' + (data.error || 'Email ou mot de passe incorrect');
                    loginStatus.style.color = '#b33c3c';
                }
            } catch (error) {
                loginStatus.innerHTML = '❌ Erreur de connexion au serveur.';
                loginStatus.style.color = '#b33c3c';
            }
        });

        // ===== AFFICHER / MASQUER LE MOT DE PASSE =====
        document.addEventListener('DOMContentLoaded', function() {
            const toggleBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            if (toggleBtn && passwordInput) {
                toggleBtn.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    this.textContent = type === 'password' ? '👁️' : '🙈';
                });
            }
        });
    </script>

</body>
</html>
