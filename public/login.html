<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — Cabine Service</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
           <!-- ===== LOGO + TITRE ===== -->
            <a href="/" style="display:flex; flex-direction:column; align-items:center; text-decoration:none; margin-bottom:16px;">
                <img src="logo.png" alt="Cabine Service" style="height:50px; width:auto;" />
                <span style="font-size:1.4rem; font-weight:600; color:var(--bordeaux-fonce); margin-top:4px;">Cabine Service</span>
            </a>
            <h1>Connexion</h1>
            <p>Accédez à votre espace gérant</p>

            <form id="loginForm">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="ex: contact@boutique.com" required />

                <label for="password">Mot de passe</label>
                <div style="position:relative;">
                    <input type="password" id="password" placeholder="••••••••" required style="padding-right: 48px;" />
                    <button type="button" id="togglePassword" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:transparent; border:none; cursor:pointer; font-size:1.2rem;">
                        👁️
                    </button>
                </div>
                <button type="submit" class="btn">Se connecter</button>
                <div style="text-align:right; margin-top:-8px; margin-bottom:16px;">
                    <a href="forgot-password.html" style="font-size:0.85rem; color:var(--bordeaux-vif); text-decoration:none;">
                        Mot de passe oublié ?
                    </a>
                </div>
            </form>

            <div id="loginStatus"></div>

            <div class="footer-links">
                Pas encore de compte ? <a href="register.html">S'inscrire</a>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginStatus = document.getElementById('loginStatus');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            loginStatus.innerHTML = '⏳ Connexion en cours...';
            loginStatus.style.color = 'var(--marron-fonce)';

            try {
                const response = await fetch('https://cabine-service.onrender.com/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

            document.getElementById('togglePassword').addEventListener('click', function() {
                    const input = document.getElementById('password');
                    if (input.type === 'password') {
                        input.type = 'text';
                        this.textContent = '🙈';
                    } else {
                        input.type = 'password';
                        this.textContent = '👁️';
                    }
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('shop', JSON.stringify(data.shop));

                    loginStatus.innerHTML = '✅ Connexion réussie, redirection...';
                    loginStatus.style.color = '#1a7a3a';

                    if (email === 'admin@cabineservice.com') {
                        setTimeout(() => window.location.href = 'admin.html', 1000);
                    } else {
                        setTimeout(() => window.location.href = 'dashboard.html', 1000);
                    }
                } else {
                    loginStatus.innerHTML = '❌ ' + (data.error || 'Email ou mot de passe incorrect');
                    loginStatus.style.color = '#b33c3c';
                }
            } catch (error) {
                loginStatus.innerHTML = '❌ Erreur de connexion au serveur.';
                loginStatus.style.color = '#b33c3c';
            }
        });
    </script>

</body>
</html>
