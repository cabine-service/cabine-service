<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cabine — Demande de taille</title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
</head>
<body>

    <div class="container">
        <a href="/" class="logo-link">
            <img src="logo.png" alt="Cabine Service" class="logo-img" />
        </a>
        <div class="header">
            <h1>Besoin d'une autre taille ?</h1>
            <p class="cabine-info">Cabine n° <span id="cabine-number">1</span></p>
        </div>

        <div class="form-group">
            <label for="size">Choisissez la taille souhaitée :</label>
            <select id="size">
                <option value="XS">XS</option>
                <option value="S">S</option>
                <option value="M" selected>M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
                <option value="XXL">XXL</option>
            </select>
        </div>

        <button id="takePhotoBtn">Prendre une photo du vêtement</button>

        <div id="previewContainer" style="display:none;">
            <p>Photo prise :</p>
            <img id="previewImage" src="" alt="Aperçu" />
        </div>

        <button id="sendBtn" disabled>Envoyer la demande</button>
        <div id="statusMessage"></div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
